erp_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('ANALYTICS_HOST', 'localhost') }}"
      user: "{{ env_var('ANALYTICS_USER', 'analytics_owner') }}"
      password: "{{ env_var('ANALYTICS_PASSWORD', 'analytics_owner_password') }}"
      port: "{{ env_var('ANALYTICS_PORT', '5432') | int }}"
      dbname: "{{ env_var('ANALYTICS_DB', 'erp_analytics') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      retries: 1
    test:
      type: postgres
      host: "{{ env_var('ANALYTICS_HOST', 'localhost') }}"
      user: "{{ env_var('ANALYTICS_USER', 'analytics_owner') }}"
      password: "{{ env_var('ANALYTICS_PASSWORD', 'analytics_owner_password') }}"
      port: "{{ env_var('ANALYTICS_PORT', '5432') | int }}"
      dbname: "{{ env_var('ANALYTICS_DB', 'erp_analytics') }}"
      schema: public
      threads: 1
      keepalives_idle: 0
      connect_timeout: 10
