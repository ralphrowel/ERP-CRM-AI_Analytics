<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="laneHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="accentPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <marker id="wfArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8" />
    </marker>
    <marker id="wfArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="wfArrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .wf-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; }
    .wf-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .col-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .step-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #94a3b8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #c7d2fe; letter-spacing: 0.5px; }
  </style>

  <!-- Background -->
  <rect width="1100" height="680" rx="16" fill="url(#wfBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="30" y="24" width="6" height="38" rx="3" fill="url(#accentPill)" />
  <text x="46" y="44" class="wf-title">AGENT EXECUTION &amp; REASONING PIPELINE</text>
  <text x="46" y="60" class="wf-sub">End-to-End Query Lifecycle • Zero-Hallucination Sandbox • Token Metrology</text>

  <!-- Lifeline Columns -->
  <!-- 1. User & Client (x=80) -->
  <!-- 2. Security & Quota (x=270) -->
  <!-- 3. Coordinator & Router (x=480) -->
  <!-- 4. Execution Sandbox (x=690) -->
  <!-- 5. LLM Inference (x=890) -->

  <!-- Column Headers -->
  <g transform="translate(40, 85)">
    <rect width="150" height="36" rx="8" fill="url(#laneHead)" stroke="#475569"/>
    <text x="75" y="23" text-anchor="middle" class="col-head">1. Client / UI</text>
  </g>
  <line x1="115" y1="125" x2="115" y2="630" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g transform="translate(240, 85)">
    <rect width="160" height="36" rx="8" fill="url(#laneHead)" stroke="#475569"/>
    <text x="80" y="23" text-anchor="middle" class="col-head">2. Security Perimeter</text>
  </g>
  <line x1="320" y1="125" x2="320" y2="630" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g transform="translate(450, 85)">
    <rect width="160" height="36" rx="8" fill="url(#laneHead)" stroke="#475569"/>
    <text x="80" y="23" text-anchor="middle" class="col-head">3. Agent Coordinator</text>
  </g>
  <line x1="530" y1="125" x2="530" y2="630" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g transform="translate(660, 85)">
    <rect width="160" height="36" rx="8" fill="url(#laneHead)" stroke="#475569"/>
    <text x="80" y="23" text-anchor="middle" class="col-head">4. Data Engine / COW</text>
  </g>
  <line x1="740" y1="125" x2="740" y2="630" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g transform="translate(870, 85)">
    <rect width="160" height="36" rx="8" fill="url(#laneHead)" stroke="#475569"/>
    <text x="80" y="23" text-anchor="middle" class="col-head">5. LLM Synthesis</text>
  </g>
  <line x1="950" y1="125" x2="950" y2="630" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ==================== STEP 1: Dispatch Query ==================== -->
  <line x1="115" y1="160" x2="320" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#wfArrow)"/>
  <rect x="140" y="142" width="150" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
  <circle cx="152" cy="158" r="8" fill="url(#accentPill)"/>
  <text x="152" y="162" text-anchor="middle" class="step-num">1</text>
  <text x="166" y="157" class="step-text">POST /api/chat/ask</text>
  <text x="166" y="169" class="step-desc">Bearer JWT + Query String</text>

  <!-- ==================== STEP 2: Quota & Boundary Check ==================== -->
  <rect x="290" y="195" width="60" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="215" text-anchor="middle" class="step-num" fill="#fbbf24">2</text>
  <text x="320" y="232" text-anchor="middle" class="tag-text">50k QUOTA</text>

  <line x1="320" y1="245" x2="530" y2="245" stroke="#818cf8" stroke-width="2" marker-end="url(#wfArrow)"/>
  <rect x="360" y="228" width="130" height="30" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="370" y="244" class="step-text">Allow &amp; Forward</text>
  <text x="370" y="254" class="step-desc">Quota validated (&lt;50k)</text>

  <!-- ==================== STEP 3: Intent Classification ==================== -->
  <line x1="530" y1="285" x2="950" y2="285" stroke="#818cf8" stroke-width="2" marker-end="url(#wfArrow)"/>
  <rect x="680" y="268" width="180" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
  <circle cx="694" cy="284" r="8" fill="url(#accentPill)"/>
  <text x="694" y="288" text-anchor="middle" class="step-num">3</text>
  <text x="708" y="283" class="step-text">Route Query Intent</text>
  <text x="708" y="295" class="step-desc">Structured / RAG / Hybrid</text>

  <line x1="950" y1="320" x2="530" y2="320" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#wfArrowGray)"/>
  <rect x="680" y="306" width="180" height="24" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="770" y="322" text-anchor="middle" class="step-desc">Route Decision: "structured" (0.98)</text>

  <!-- ==================== STEP 4: DataFrame Extraction ==================== -->
  <line x1="530" y1="360" x2="740" y2="360" stroke="#818cf8" stroke-width="2" marker-end="url(#wfArrow)"/>
  <rect x="560" y="342" width="150" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
  <circle cx="574" cy="358" r="8" fill="url(#accentPill)"/>
  <text x="574" y="362" text-anchor="middle" class="step-num">4</text>
  <text x="588" y="357" class="step-text">Fetch Dataset Schema</text>
  <text x="588" y="369" class="step-desc">Inspect Columns &amp; COW State</text>

  <!-- ==================== STEP 5: Code Plan & Exec ==================== -->
  <line x1="530" y1="410" x2="950" y2="410" stroke="#818cf8" stroke-width="2" marker-end="url(#wfArrow)"/>
  <rect x="680" y="392" width="180" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
  <circle cx="694" cy="408" r="8" fill="url(#accentPill)"/>
  <text x="694" y="412" text-anchor="middle" class="step-num">5</text>
  <text x="708" y="407" class="step-text">Generate Exec Plan</text>
  <text x="708" y="419" class="step-desc">Pandas Filter + Aggregation Spec</text>

  <line x1="950" y1="445" x2="740" y2="445" stroke="#34d399" stroke-width="2" marker-end="url(#wfArrowGreen)"/>
  <rect x="780" y="430" width="130" height="28" rx="6" fill="#1e293b" stroke="#059669"/>
  <circle cx="792" cy="444" r="7" fill="url(#emeraldPill)"/>
  <text x="792" y="448" text-anchor="middle" class="step-num">6</text>
  <text x="805" y="448" class="step-text">Execute Sandbox</text>

  <!-- ==================== STEP 7: Chart Synthesizer ==================== -->
  <line x1="740" y1="495" x2="530" y2="495" stroke="#34d399" stroke-width="2" marker-end="url(#wfArrowGreen)"/>
  <rect x="560" y="478" width="150" height="32" rx="6" fill="#1e293b" stroke="#059669"/>
  <circle cx="574" cy="494" r="8" fill="url(#emeraldPill)"/>
  <text x="574" y="498" text-anchor="middle" class="step-num">7</text>
  <text x="588" y="493" class="step-text">Synthesize Plotly</text>
  <text x="588" y="505" class="step-desc">Layout, Axes, Color Palette</text>

  <!-- ==================== STEP 8: Metrology & Response ==================== -->
  <line x1="530" y1="545" x2="320" y2="545" stroke="#818cf8" stroke-width="2" marker-end="url(#wfArrow)"/>
  <rect x="360" y="528" width="140" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
  <circle cx="374" cy="544" r="8" fill="url(#accentPill)"/>
  <text x="374" y="548" text-anchor="middle" class="step-num">8</text>
  <text x="388" y="543" class="step-text">Atomic Token Deduct</text>
  <text x="388" y="555" class="step-desc">Deduct used prompt/comp tokens</text>

  <!-- ==================== STEP 9: Return to User ==================== -->
  <line x1="320" y1="590" x2="115" y2="590" stroke="#34d399" stroke-width="2.5" marker-end="url(#wfArrowGreen)"/>
  <rect x="140" y="572" width="160" height="34" rx="6" fill="#1e293b" stroke="#10b981"/>
  <circle cx="154" cy="589" r="8" fill="url(#emeraldPill)"/>
  <text x="154" y="593" text-anchor="middle" class="step-num">9</text>
  <text x="168" y="588" class="step-text">Render Reactive UI</text>
  <text x="168" y="600" class="step-desc">Plotly Chart + Narrative + Table</text>

  <!-- Bottom KPI Pills -->
  <g transform="translate(60, 642)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="16" text-anchor="middle" class="tag-text" fill="#94a3b8">LATENCY: &lt; 800MS MEDIAN</text>

    <rect x="210" y="0" width="220" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="320" y="16" text-anchor="middle" class="tag-text" fill="#94a3b8">ZERO-HALLUCINATION SANDBOX</text>

    <rect x="460" y="0" width="230" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="575" y="16" text-anchor="middle" class="tag-text" fill="#94a3b8">COPY-ON-WRITE TENANT ISOLATION</text>

    <rect x="720" y="0" width="220" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="830" y="16" text-anchor="middle" class="tag-text" fill="#94a3b8">47 PASSED INTEGRATION TESTS</text>
  </g>
</svg>
