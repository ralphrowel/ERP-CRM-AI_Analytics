name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_crm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Database Roles & Grants
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d erp_crm -c "
            CREATE ROLE erp_owner WITH LOGIN PASSWORD 'erp_owner_password';
            CREATE ROLE erp_app WITH LOGIN PASSWORD 'erp_app_password';
            GRANT ALL ON DATABASE erp_crm TO erp_owner;
            ALTER SCHEMA public OWNER TO erp_owner;
            GRANT USAGE ON SCHEMA public TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_owner IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO erp_app;
          "

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Alembic Migrations
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://erp_owner:erp_owner_password@localhost:5432/erp_crm
        run: |
          alembic upgrade head

      - name: Run Tests (Real PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://erp_app:erp_app_password@localhost:5432/erp_crm
          MIGRATION_DATABASE_URL: postgresql+psycopg://erp_owner:erp_owner_password@localhost:5432/erp_crm
          SECRET_KEY: test-secret-key-for-ci-pipeline-min-32-chars-long!
        run: |
          pytest -v

  frontend-ci:
    name: Frontend Lint, Type-Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build Application
        run: npm run build
