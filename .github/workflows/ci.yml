name: CI Pipeline

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_crm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Database Roles & Grants
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d erp_crm -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'erp_owner') THEN
                CREATE ROLE erp_owner WITH LOGIN CREATEDB PASSWORD 'erp_owner_password';
              ELSE
                ALTER ROLE erp_owner WITH CREATEDB;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'erp_app') THEN
                CREATE ROLE erp_app WITH LOGIN PASSWORD 'erp_app_password';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'etl_reader') THEN
                CREATE ROLE etl_reader WITH LOGIN PASSWORD 'etl_reader_password';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'analytics_owner') THEN
                CREATE ROLE analytics_owner WITH LOGIN PASSWORD 'analytics_owner_password';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'root') THEN
                CREATE ROLE root WITH SUPERUSER LOGIN PASSWORD 'postgres_password';
              ELSE
                ALTER ROLE root WITH SUPERUSER LOGIN PASSWORD 'postgres_password';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'runner') THEN
                CREATE ROLE runner WITH SUPERUSER LOGIN PASSWORD 'postgres_password';
              ELSE
                ALTER ROLE runner WITH SUPERUSER LOGIN PASSWORD 'postgres_password';
              END IF;
            END
            \$\$;
            GRANT ALL ON DATABASE erp_crm TO erp_owner;
            ALTER SCHEMA public OWNER TO erp_owner;
            GRANT USAGE ON SCHEMA public TO erp_app, etl_reader;
            GRANT CONNECT ON DATABASE erp_crm TO etl_reader;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_owner IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_owner IN SCHEMA public GRANT SELECT ON TABLES TO etl_reader;
          " || true
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d erp_crm -c "CREATE DATABASE root OWNER postgres;" || true
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d erp_crm -c "CREATE DATABASE erp_analytics OWNER analytics_owner;" || true
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d erp_crm -c "GRANT ALL ON DATABASE erp_analytics TO analytics_owner;" || true
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d erp_analytics -c "
            CREATE SCHEMA IF NOT EXISTS etl;
            CREATE SCHEMA IF NOT EXISTS raw;
            CREATE SCHEMA IF NOT EXISTS staging;
            CREATE SCHEMA IF NOT EXISTS dq;
            CREATE SCHEMA IF NOT EXISTS mart;
            ALTER SCHEMA etl OWNER TO analytics_owner;
            ALTER SCHEMA raw OWNER TO analytics_owner;
            ALTER SCHEMA staging OWNER TO analytics_owner;
            ALTER SCHEMA dq OWNER TO analytics_owner;
            ALTER SCHEMA mart OWNER TO analytics_owner;
            CREATE TABLE IF NOT EXISTS etl.runs (
              id SERIAL,
              run_id BIGSERIAL PRIMARY KEY,
              job VARCHAR(100),
              pipeline_name VARCHAR(255) DEFAULT 'daily_pipeline',
              status VARCHAR(50) NOT NULL DEFAULT 'running',
              started_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              finished_at TIMESTAMP,
              completed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              rows_extracted INTEGER DEFAULT 0,
              records_extracted INTEGER DEFAULT 0,
              records_loaded INTEGER DEFAULT 0,
              error TEXT
            );
            CREATE TABLE IF NOT EXISTS dq.test_results (
              id SERIAL PRIMARY KEY,
              test_name VARCHAR(255) NOT NULL,
              layer VARCHAR(50) NOT NULL,
              target_table VARCHAR(255) NOT NULL,
              defect_count INTEGER DEFAULT 0,
              details TEXT,
              status VARCHAR(50) NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );
            GRANT ALL ON ALL TABLES IN SCHEMA etl, dq, raw, staging, mart TO analytics_owner;
            GRANT ALL ON ALL SEQUENCES IN SCHEMA etl, dq, raw, staging, mart TO analytics_owner;
            GRANT USAGE ON SCHEMA etl, dq, raw, staging, mart TO analytics_owner, erp_app, etl_reader;
          " || true


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Alembic Migrations
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://erp_owner:erp_owner_password@localhost:5432/erp_crm
        run: |
          alembic upgrade head

      - name: Run Tests (Real PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://erp_app:erp_app_password@localhost:5432/erp_crm
          MIGRATION_DATABASE_URL: postgresql+psycopg://erp_owner:erp_owner_password@localhost:5432/erp_crm
          ETL_READER_DATABASE_URL: postgresql+psycopg://etl_reader:etl_reader_password@localhost:5432/erp_crm
          ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_owner:analytics_owner_password@localhost:5432/erp_analytics
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: erp_crm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_OWNER_USER: erp_owner
          POSTGRES_OWNER_PASSWORD: erp_owner_password
          DBT_HOST: 127.0.0.1
          DBT_PORT: "5432"
          DBT_USER: postgres
          DBT_PASSWORD: postgres_password
          DBT_DB: erp_crm
          DBT_SCHEMA: public
          DBT_PROFILES_DIR: ${{ github.workspace }}/analytics_dbt
          ANALYTICS_HOST: 127.0.0.1
          ANALYTICS_PORT: "5432"
          ANALYTICS_USER: postgres
          ANALYTICS_PASSWORD: postgres_password
          ANALYTICS_DB: erp_crm
          SECRET_KEY: test-secret-key-for-ci-pipeline-min-32-chars-long!
        run: |
          pytest -v


  frontend-ci:
    name: Frontend Lint, Type-Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build Application
        run: npm run build
