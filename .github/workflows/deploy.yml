name: CD Pipeline - Automated Staging & Approved Production Deployment

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, Lint & Automated Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Backend Linters
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run Backend Unit & Integration Tests
        run: |
          pytest backend/tests/unit/ -v

      - name: Install Frontend Dependencies & Typecheck
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  deploy-staging:
    name: Automatic Deploy to Staging Environment
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.erp.example.com
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Production Docker Images
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Run Database Migrations (Owner Privileges)
        run: |
          echo "Executing Alembic schema migrations on staging database..."
          # docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head

      - name: Staging Health & Readiness Verification
        run: |
          echo "Verifying staging service health and TLS termination..."
          # curl -fsS https://staging.erp.example.com/health
          # curl -fsS https://staging.erp.example.com/ready

  deploy-production:
    name: Manual Approval Promotion to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Requires explicit human approval via GitHub Environment Protection Rules
    environment:
      name: production
      url: https://erp.example.com
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deploy Production Cluster
        run: |
          echo "Deploying release ${{ github.ref_name }} to production cluster..."
          # docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Execute Production Migrations
        run: |
          echo "Applying migrations to production database..."
          # docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

      - name: Verify Production Health & Security Headers
        run: |
          echo "Verifying production health check..."
          # curl -fsS -I https://erp.example.com/health | grep -i "strict-transport-security"
